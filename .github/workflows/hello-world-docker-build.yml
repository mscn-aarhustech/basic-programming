name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # 🔑 required for GHCR

    steps:
      - uses: actions/checkout@v4

      # - name: Build Docker image no GHCR
      #   run: docker build -t hello-docker ./HelloWorldDocker
      
      # - name: Test Docker image no GHCR
      #   run: docker run hello-docker

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/hello-docker:latest ./Python/HelloWorldDocker

      - name: Run Docker image
        run: docker run -d ghcr.io/${{ github.repository_owner }}/hello-docker:latest

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/hello-docker:latest